<style>
:root{
  --bg:#F5F7FB; --surface:#FFFFFF; --surface2:#E9EFFC; --ink:#0E1B3D; --muted:#5A6680; --line:#DEE4F0;
  --deep:#0D1F4F; --pri:#1E45B0; --accent:#1E45B0; --accent-ink:#fff; --accent2:#4D7CF0; --lime:#B9EE3E; --lime-ink:#1A2606;
  --accent-a:rgba(30,69,176,.22); --accent-b:rgba(30,69,176,.10);
  --pitch:#3F8F5E; --pitch2:#3A865A;
  --ok:#1F8F62; --warn:#D98A2B; --bad:#C93A36; --info:#1E45B0;
  --ok-a:rgba(31,143,98,.14); --warn-a:rgba(217,138,43,.16); --bad-a:rgba(201,58,54,.13); --info-a:rgba(30,69,176,.12);
  --ta:#1E45B0; --tb:#C93A36; --tn:#F2C14E; --tgk:#7A4FB3; --tco:#0E1B3D;
  --shadow:0 10px 30px rgba(13,31,79,.12); --r:14px;
  --safeT:env(safe-area-inset-top,0px); --safeB:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A1430; --surface:#111E42; --surface2:#18284F; --ink:#EAF0FF; --muted:#9AA7C7; --line:#24345F;
  --accent:#4D7CF0; --accent2:#7FA2F5; --accent-a:rgba(77,124,240,.30); --accent-b:rgba(77,124,240,.16); --info:#7FA2F5; --info-a:rgba(77,124,240,.18);
  --ta:#4D7CF0; --tco:#0A1430; --pitch:#2F6E49; --pitch2:#2B6644; --shadow:0 10px 30px rgba(0,0,0,.45);
}}
:root[data-theme="dark"]{
  --bg:#0A1430; --surface:#111E42; --surface2:#18284F; --ink:#EAF0FF; --muted:#9AA7C7; --line:#24345F;
  --accent:#4D7CF0; --accent2:#7FA2F5; --accent-a:rgba(77,124,240,.30); --accent-b:rgba(77,124,240,.16); --info:#7FA2F5; --info-a:rgba(77,124,240,.18);
  --ta:#4D7CF0; --tco:#0A1430; --pitch:#2F6E49; --pitch2:#2B6644; --shadow:0 10px 30px rgba(0,0,0,.45);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Heebo,system-ui,Arial,sans-serif;font-size:15px;line-height:1.5;
  padding-top:var(--safeT);overscroll-behavior-y:none}
h1,h2,h3{font-family:"Secular One",Heebo,sans-serif;font-weight:400;margin:0;line-height:1.15;text-wrap:balance}
h1{font-size:24px} h2{font-size:19px} h3{font-size:16px}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
a{color:var(--accent)} :root[data-theme="dark"] a{color:var(--accent2)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) a{color:var(--accent2)}}
.sm{font-size:13px}
.xs{font-size:12px}
.hide{display:none!important}
.alert{background:var(--bad-a);border:1px solid var(--bad);color:var(--bad);
  border-radius:10px;padding:10px 12px;font-size:13.5px;line-height:1.45}
.alert.ok{background:var(--ok-a);border-color:var(--ok);color:var(--ok)}
.kid{display:flex;gap:12px;align-items:center;padding:14px;border:1px solid var(--line);
  border-radius:14px;background:var(--surface);margin-bottom:10px}
.kid .av{width:46px;height:46px;font-size:16px}
.sw{position:relative;display:inline-block;width:46px;height:27px;flex:none}
.sw input{opacity:0;width:0;height:0}
.sw i{position:absolute;inset:0;background:var(--line);border-radius:99px;transition:.18s}
.sw i:before{content:"";position:absolute;width:21px;height:21px;border-radius:50%;
  background:#fff;top:3px;inset-inline-end:3px;transition:.18s;box-shadow:0 1px 3px rgba(13,31,79,.25)}
.sw input:checked + i{background:var(--ok)}
.sw input:checked + i:before{transform:translateX(-19px)}
[dir="ltr"] .sw input:checked + i:before{transform:translateX(19px)}
/* language picker */
.langsel{width:auto;padding:6px 10px;font-size:13px;border-radius:999px;background:var(--surface)}
.langrow{display:flex;justify-content:center;margin-top:14px}
.togrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.togrow:last-child{border-bottom:0}
.togrow .t{flex:1}.togrow .t b{display:block;font-size:14.5px}
.togrow .t span{font-size:12px;color:var(--muted);line-height:1.4;display:block;margin-top:2px}

/* layout */
#app{min-height:100%;padding-bottom:calc(72px + var(--safeB))}
.wrap{max-width:900px;margin:0 auto;padding:14px 16px 20px}
.topbar{position:sticky;top:var(--safeT);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.topbar .in{max-width:900px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.topbar h1{font-size:19px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iconbtn{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:18px;background:var(--surface);border:1px solid var(--line)}
.nav{position:fixed;inset-inline:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:var(--safeB);box-shadow:0 -6px 20px rgba(13,31,79,.07)}
.nav .in{max-width:900px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted)}
.nav button .ic{font-size:19px;line-height:1}
.nav button.on{color:var(--accent);font-weight:500}

/* cards & bits */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.card+.card{margin-top:10px}
.row{display:flex;gap:8px;align-items:center}
.row.wrap{flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}
.stack{display:flex;flex-direction:column;gap:10px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:500;text-align:center}
.btn.primary{background:var(--pri);color:#fff;border-color:var(--pri)}
.btn.ghost{background:transparent}
.btn.lime{background:var(--lime);color:var(--lime-ink);border-color:var(--lime);font-weight:700}
.brandmark{display:flex;flex-direction:column;align-items:center;gap:10px}
.brandmark img{width:64px;height:64px;filter:drop-shadow(0 8px 18px rgba(13,31,79,.22))}
.brandword{font-family:Sora,Heebo,sans-serif;font-size:26px;letter-spacing:-.4px;line-height:1;direction:ltr;color:var(--ink);font-weight:400}
.brandword b{font-weight:700}.brandword span{color:var(--accent)}
.banner.sync{background:var(--info)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:9px}
.btn.big{padding:14px;font-size:16px;width:100%}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn[disabled]{opacity:.45;pointer-events:none}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-size:12px;background:var(--surface2)}
.pill.ok{background:var(--ok-a);color:var(--ok)}
.pill.bad{background:var(--bad-a);color:var(--bad)}
.pill.warn{background:var(--warn-a);color:var(--warn)}
.pill.info{background:var(--info-a);color:var(--info)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:13.5px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sep{height:1px;background:var(--line);margin:12px -14px}
.empty{padding:34px 14px;text-align:center;color:var(--muted)}
label.f{display:grid;gap:5px;font-size:13px;color:var(--muted)}
.hd{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:18px 0 8px}
.hd h2{font-size:17px}

/* player tiles */
.plist{display:flex;flex-direction:column;gap:6px}
.prow{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 11px}
.av{width:36px;height:36px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none;color:var(--muted)}
.av.a{background:var(--accent-b);color:var(--ta)} .av.b{background:var(--bad-a);color:var(--tb)}
.pname{flex:1;min-width:0}
.pname b{font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center;position:relative;min-height:66px;display:flex;flex-direction:column;justify-content:center;gap:2px}
.tile b{font-weight:500;font-size:13.5px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-a)}
.tile .dot{position:absolute;top:6px;inset-inline-end:6px;width:8px;height:8px;border-radius:50%}
.tile .cnt{position:absolute;top:5px;inset-inline-start:7px;font-size:11px;color:var(--accent);font-weight:700}
.tile.off{opacity:.42}
.tile.ta{border-inline-start:4px solid var(--ta)} .tile.tb{border-inline-start:4px solid var(--tb)}

/* score buttons */
.scorerow{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.scorerow button{border:1px solid var(--line);border-radius:10px;padding:13px 0;font-weight:700;font-size:17px;background:var(--surface)}
.scorerow button[data-s="1"]{color:var(--bad)} .scorerow button[data-s="2"]{color:var(--warn)}
.scorerow button[data-s="4"]{color:#3E9A6C} .scorerow button[data-s="5"]{color:var(--ok)}
.starrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.starrow button{border:1px solid var(--line);border-radius:10px;padding:14px 0;font-size:19px;background:var(--surface)}

/* sheet / modal */
.sheetwrap{position:fixed;inset:0;z-index:60;display:none}
.sheetwrap.open{display:block}
.sheetwrap .bd{position:absolute;inset:0;background:rgba(13,31,79,.5)}
.sheet{position:absolute;inset-inline:0;bottom:0;background:var(--surface);border-radius:18px 18px 0 0;
  max-height:88vh;overflow:auto;padding:16px 16px calc(18px + var(--safeB));box-shadow:var(--shadow);animation:up .18s ease}
@keyframes up{from{transform:translateY(18px);opacity:.6}to{transform:none;opacity:1}}
.sheet .grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* timer */
.timer{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.timer .t{font-family:"Secular One",sans-serif;font-size:38px;line-height:1}
.timer .bar{height:6px;background:var(--surface2);border-radius:99px;overflow:hidden;margin-top:8px}
.timer .bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .5s linear}
.timer .bar i.over{background:var(--bad)}
.topbar .in .logo{width:26px;height:26px;flex:none}

/* attribute bars */
.attr{display:grid;grid-template-columns:auto 1fr auto auto;gap:8px;align-items:center;padding:6px 0;font-size:14px}
.attr .bar{height:7px;background:var(--surface2);border-radius:99px;overflow:hidden}
.attr .bar i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.attr .v{font-weight:700;min-width:28px;text-align:end}
.attr .tr{width:16px;text-align:center;font-size:12px}
.attr.dim{opacity:.5}
/* quick notes during a session */
.notes{margin-top:10px}
.ngrp{margin-top:8px}.ngrp p{margin-bottom:5px}
.nbtns{display:flex;flex-wrap:wrap;gap:6px}
.nb{border-radius:10px;padding:8px 11px;font-size:13.5px;border:1px solid var(--line);background:var(--surface);transition:transform .12s,background .2s}
.nb.up{border-color:rgba(31,143,98,.35);color:var(--ok);background:var(--ok-a)}
.nb.dn{border-color:rgba(217,138,43,.4);color:#B4691C;background:var(--warn-a)}
.nb.hit{transform:scale(.94);background:var(--accent);color:#fff;border-color:var(--accent)}
:root[data-theme="dark"] .nb.dn{color:var(--warn)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .nb.dn{color:var(--warn)}}
/* FM-style attribute sheet */
.fm{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:4px 18px}
.fmcol h4{margin:4px 0 6px;font-size:12px;letter-spacing:.06em;color:var(--accent);font-weight:700}
.fmr{display:grid;grid-template-columns:minmax(0,1fr) auto 14px;align-items:center;gap:6px;padding:5px 8px;border-radius:7px;font-size:14px}
.fmcol .fmr:nth-of-type(odd){background:var(--surface2)}
.fmr.dim span:first-child{color:var(--muted)} .fmr.dim .fmv{opacity:.55}
.fmv{font-weight:700;min-width:24px;text-align:center;font-variant-numeric:tabular-nums}
.fmv.v1{color:var(--bad)} .fmv.v2{color:var(--warn)} .fmv.v3{color:var(--ink)} .fmv.v4{color:var(--ok)}
.fmt{font-size:11px;text-align:center}
.fmside{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.fmside div{display:flex;flex-direction:column;gap:2px}.fmside b{font-weight:600;font-size:14px}
.fmstars{color:var(--accent);letter-spacing:1px}.fmstars i{font-style:normal;color:var(--line)}
@media (max-width:420px){.fmside{grid-template-columns:repeat(2,1fr)}}
.bar{height:7px;background:var(--surface2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--accent)}

/* diagram */
.dg{width:100%;aspect-ratio:3/2;border-radius:10px;display:block}
.bwrap{padding-bottom:10px}
.bpitch{border:1px solid var(--line);touch-action:none;user-select:none}
.btools{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px;margin-top:8px}
.btool{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 2px;
  font-size:10.5px;line-height:1.25;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted)}
.btool span{font-size:17px;line-height:1}
.btool.on{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 2px var(--accent-a)}
@media (orientation:landscape){.bpitch{max-height:64vh;width:auto;margin:0 auto}}
.toast{position:fixed;bottom:calc(86px + var(--safeB));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:9px 16px;border-radius:999px;font-size:13.5px;z-index:70;opacity:0;transition:opacity .2s;pointer-events:none;max-width:88vw;text-align:center}
.toast.show{opacity:1}
.banner{background:var(--warn);color:#fff;text-align:center;padding:5px;font-size:12.5px}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
table.tbl th,table.tbl td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:start}
table.tbl th{color:var(--muted);font-weight:500;font-size:12.5px}
.scroll-x{overflow-x:auto}
.fmr>:first-child{min-width:0;overflow-wrap:anywhere;hyphens:auto}
</style>
</head>
<body>
<div id="offlineBar" class="banner hide">אופליין — הנתונים נשמרים במכשיר ויסונכרנו אוטומטית</div>

<nav class="nav hide" id="nav"><div class="in">
  <button data-go="home"><span class="ic">🏠</span>היום</button>
  <button data-go="squad"><span class="ic">👥</span>סגל</button>
  <button data-go="program"><span class="ic">📋</span>אימונים</button>
  <button data-go="library"><span class="ic">⚽</span>ספרייה</button>
  <button data-go="more"><span class="ic">⋯</span>עוד</button>
</div></nav>
<div class="sheetwrap" id="sheetWrap"><div class="bd" id="sheetBd"></div><div class="sheet" id="sheet"></div></div>
